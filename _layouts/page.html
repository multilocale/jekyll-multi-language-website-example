---
layout: default
---

{%- assign strings = site.data.strings -%}
{%- assign heading = page.title -%}
{%- if page.title_key -%}{%- assign heading = strings[page.title_key] -%}{%- endif -%}

<article class="prose" lang="{{ page.rendered_lang | default: site.active_lang }}">
  <h1>{{ heading }}</h1>
  {{ content }}
</article>
