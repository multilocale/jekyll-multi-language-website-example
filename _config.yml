# Multilocale Jekyll example — site configuration.
#
# Read README.md first; this file only makes sense next to it.

title: Multilocale Jekyll example
# Replace with the domain you deploy to. jekyll-polyglot needs it to build
# language switchers and the canonical/hreflang tags, and sitemap.xml uses it
# for absolute URLs. Leaving it wrong is the single most common reason an
# otherwise-correct multi-language Jekyll site gets indexed badly.
url: https://example.com
baseurl: ''

# ---------------------------------------------------------------------------
# jekyll-polyglot
# ---------------------------------------------------------------------------
# Jekyll is run once per language. The default language is written to the root
# of _site; every other language gets its own subdirectory (_site/es, _site/it)
# and all its internal links are rewritten to stay inside it.
languages: ['en', 'es', 'it']
default_lang: 'en'

# Built once, shared by every language. Files and directories listed here are
# emitted only in the default-language pass, and links to them are left alone
# rather than being rewritten to /es/... — which is exactly what you want for
# a stylesheet, and mandatory for robots.txt and sitemap.xml, which must exist
# once at the root of the domain.
exclude_from_localization: ['assets/', 'robots.txt', 'sitemap.xml']

# Polyglot forks one process per language. Set to false on Windows, or if you
# ever see a plugin misbehave under it.
parallel_localization: true

# Posts keep a per-language slug (/blog/… vs /es/blog/…), which is why the
# translated posts are linked to each other with `page_id` instead of a shared
# permalink. See README.md § "Two ways to translate".
permalink: /blog/:title/

plugins:
  - jekyll-polyglot

# Repository files that are not part of the website. Jekyll appends its own
# defaults (Gemfile, vendor/, node_modules/, …) to this list rather than
# replacing them.
exclude:
  - AGENTS.md
  - LICENSE
  - Makefile
  - README.md
  - multilocale.json
  - scripts/
