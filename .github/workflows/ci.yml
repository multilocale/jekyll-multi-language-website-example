name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # This repository is a teaching example, not a deployed site: nothing here
  # changes on its own, but Ruby, Jekyll and jekyll-polyglot do. A monthly run
  # is what turns "it rotted three years ago" into a failing build the week it
  # happens.
  schedule:
    - cron: '0 6 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Not `.ruby-version` (which pins an exact patch for local rbenv and
          # asdf users): '4.0' resolves to whatever 4.0.x the runner has, so a
          # patch release does not fail CI.
          ruby-version: '4.0'
          bundler-cache: true

      # `make check` builds the site and then asserts that each language
      # directory really holds that language, that the untranslated post fell
      # back to English, and that robots.txt / sitemap.xml / the stylesheet
      # were written exactly once. A bare `jekyll build` would pass even if
      # polyglot emitted the same language three times.
      - name: Build and verify every language
        run: make check

      - name: Check the committed dictionaries are valid, flat JSON
        run: |
          for file in _data/*/strings.json; do
            ruby -rjson -e '
              data = JSON.parse(File.read(ARGV[0]))
              nested = data.reject { |_, value| value.is_a?(String) }
              unless nested.empty?
                abort "#{ARGV[0]}: multilocale import accepts flat JSON only, " \
                      "these keys are not strings: #{nested.keys.join(", ")}"
              end
              puts "#{ARGV[0]}: #{data.size} keys"
            ' "$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
